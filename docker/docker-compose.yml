services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: api
    ports:
      - "81:81"
    volumes:
      - C:/Users/nourm/.cache/huggingface:/root/.cache/huggingface
      - ../storage:/app/storage
    networks:
      - backend
    restart: always
    env_file:
      - ./env/.env.app
    depends_on:
      - mongodb
      - qdrant
      - redis
      - litellm


  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: qdrant
    volumes:
      - eduhub_qdrant_data:/qdrant/storage
    networks:
      - backend
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: always

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    volumes:
      - eduhub_mongodata:/data/db
    networks:
      - backend
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ./env/.env.mongodb
    command: ["mongod", "--auth"]

  redis:
    image: redis:7.4
    container_name: chat-redis
    volumes:
      - eduhub_redis_data:/data
    networks:
      - backend
    restart: always
    env_file:
      - ./env/.env.redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redisadmin123} --appendonly yes

  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellmpass123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/litellm_config.yaml:/app/config.yaml:ro
    networks:
      - backend
    restart: always
    env_file:
      - ./env/.env.litellm
    environment:
      - DATABASE_URL=postgresql://litellm:${LITELLM_DB_PASSWORD:-litellmpass123}@litellm-db:5432/litellm
    command: >
      --config /app/config.yaml
      --port 4000
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  backend:
    driver: bridge

volumes:
  eduhub_qdrant_data:
  eduhub_mongodata:
  eduhub_redis_data:
  litellm_pgdata: