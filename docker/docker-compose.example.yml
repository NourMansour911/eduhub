# ====================================================================
# EduHub Docker Compose Example Setup
# --------------------------------------------------------------------
# Quick Start:
# 1. Copy the example environment files under `docker/env/`:
#      cp env/.env.example.app env/.env.app
#      cp env/.env.example.mongodb env/.env.mongodb
#      cp env/.env.example.redis env/.env.redis
#      cp env/.env.example.grafana env/.env.grafana
# 2. Add your secret keys and credentials to the newly created .env files.
# 3. Start the services:
#      docker compose -f docker-compose.example.yml up -d
# ====================================================================

services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: api
    ports:
      - "81:81"
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ../storage:/app/storage
    networks:
      - backend
    restart: always
    env_file:
      - ./env/.env.app
    depends_on:
      - mongodb
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: qdrant
    volumes:
      - eduhub_qdrant_data:/qdrant/storage
    networks:
      - backend
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: always

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    volumes:
      - eduhub_mongodata:/data/db
    networks:
      - backend
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ./env/.env.mongodb
    command: ["mongod", "--auth"]

  redis:
    image: redis:7.4
    container_name: chat-redis
    volumes:
      - eduhub_redis_data:/data
    networks:
      - backend
    restart: always
    env_file:
      - ./env/.env.redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redisadmin123} --appendonly yes

networks:
  backend:
    driver: bridge

volumes:
  eduhub_qdrant_data:
  eduhub_mongodata:
  eduhub_redis_data:
